<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>1.5°C 오프닝</title>
<style>
  @font-face { font-family: 'Anton'; src: url(fonts/anton.woff2) format('woff2'); }
  @font-face { font-family: 'BHS'; src: url(fonts/bhs.woff2) format('woff2'); }
  @font-face { font-family: 'Pen'; src: url(fonts/pen.woff2) format('woff2'); }
  @font-face { font-family: 'KR'; src: url(fonts/kr-500.woff2) format('woff2'); font-weight: 400 600; }
  @font-face { font-family: 'KR'; src: url(fonts/kr-900.woff2) format('woff2'); font-weight: 700 900; }
  :root { --neon: #d7ff00; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: 'KR', sans-serif; color: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .L { position: absolute; inset: 0; display: none; }
  .sp { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
  .ant { font-family: 'Anton', 'BHS'; }
  .band { position: absolute; left: 0; white-space: nowrap; font-family: 'BHS'; font-size: 150px; line-height: 1; transform-origin: 0 50%; }
  .card { position: absolute; left: 560px; width: 800px; height: 150px; border-radius: 34px; background: #fff; color: #000; display: flex; align-items: center; gap: 26px; padding: 0 30px; box-sizing: border-box;
          box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .card img { width: 100px; height: 100px; border-radius: 20px; object-fit: cover; filter: grayscale(1) contrast(1.2); flex: none; }
  .tag { position: absolute; font-family: 'BHS'; font-size: 130px; color: transparent; -webkit-text-stroke: 3px var(--neon); white-space: nowrap; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #grain { position: absolute; inset: 0; pointer-events: none; opacity: .05; background: repeating-radial-gradient(circle at 17% 31%, #fff 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
</style>
</head>
<body>
<div id="stage"><div id="cam">
  <!-- 1–2 · dot, heartbeat, orbit -->
  <div class="L" id="L1">
    <svg width="1920" height="1080" style="position:absolute;inset:0;overflow:visible">
      <ellipse id="orb" cx="960" cy="540" rx="330" ry="96" fill="none" stroke="#d7ff00" stroke-width="3" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" transform="rotate(-14 960 540)"/>
      <g id="spk1"><path d="M0 -26 L6 -6 L26 0 L6 6 L0 26 L-6 6 L-26 0 L-6 -6 Z" fill="#fff"/></g>
      <g id="spk2"><path d="M0 -18 L4 -4 L18 0 L4 4 L0 18 L-4 4 L-18 0 L-4 -4 Z" fill="#fff"/></g>
    </svg>
    <div class="sp ant" id="t1" style="top:170px;font-size:64px;letter-spacing:60px;padding-left:60px">E A R T H</div>
    <div class="sp" id="t2" style="top:820px;font-size:52px;font-weight:900;letter-spacing:44px;padding-left:44px">지구의 체온</div>
  </div>
  <!-- 3 · neon world, temperature line -->
  <div class="L" id="L3" style="background:#d7ff00">
    <svg width="1920" height="1080" style="position:absolute;inset:0">
      <line x1="160" y1="241" x2="1760" y2="241" stroke="#000" stroke-width="3" stroke-dasharray="14 12"/>
      <line x1="160" y1="820" x2="1760" y2="820" stroke="rgba(0,0,0,.25)" stroke-width="2"/>
      <path id="graph" fill="none" stroke="#000" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
      <circle id="tip" r="16" fill="#000"/>
    </svg>
    <div class="ant" style="position:absolute;left:1080px;top:180px;font-size:44px;color:#000">1.5°C 선</div>
    <div class="ant" id="year" style="position:absolute;left:160px;top:70px;font-size:150px;color:#000;letter-spacing:6px">1850</div>
    <div id="tiplab" class="ant" style="position:absolute;left:0;top:0;font-size:72px;color:#000;white-space:nowrap"></div>
    <div style="position:absolute;left:160px;top:860px;font-size:28px;font-weight:900;color:#000;letter-spacing:6px">산업화 이전 대비 지구 평균기온 · 2024년 약 +1.55°C (WMO)</div>
  </div>
  <!-- 4 · glitch bands + thermometer -->
  <div class="L" id="L4">
    <div id="bands"></div>
    <div style="position:absolute;left:840px;top:130px;width:240px;height:820px;background:#000;border-radius:120px"></div>
    <svg width="1920" height="1080" style="position:absolute;inset:0">
      <rect id="merc" x="935" y="700" width="50" height="10" rx="25" fill="#d7ff00"/>
      <circle cx="960" cy="830" r="62" fill="#d7ff00"/>
      <path d="M925 780 V210 a35 35 0 0 1 70 0 V780 a80 80 0 1 1 -70 0 Z" fill="none" stroke="#fff" stroke-width="10"/>
    </svg>
  </div>
  <!-- 5 · alerts + hashtags -->
  <div class="L" id="L5">
    <div id="tags"></div><div id="cards"></div>
  </div>
  <!-- 6 · spotlight story -->
  <div class="L" id="L6">
    <div id="spot" style="position:absolute;left:960px;top:540px;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:#fff"></div>
    <div id="h1" class="sp" style="top:440px;font-family:'Pen';font-size:92px;color:#000"></div>
    <div id="h2" class="sp" style="top:545px;font-family:'Pen';font-size:92px;color:#000"></div>
    <div id="h3" class="sp" style="top:430px;font-family:'Pen';font-size:220px;color:#000"></div>
  </div>
  <!-- 8 · burst -->
  <div class="L" id="L8">
    <svg width="1920" height="1080" style="position:absolute;inset:0"><g id="rings"></g></svg>
    <div class="sp ant" id="ch" style="top:230px;font-size:44px;letter-spacing:34px;padding-left:34px;color:#d7ff00">CHAPTER 01</div>
    <div class="sp ant" id="big" style="top:330px;font-size:380px;line-height:1;letter-spacing:10px">1.5°C</div>
    <div class="sp" id="kw" style="top:790px;font-family:'BHS';font-size:96px;letter-spacing:70px;padding-left:70px">경고</div>
  </div>
  <!-- the dot lives above everything until the burst -->
  <div id="dot" style="position:absolute;left:960px;top:540px;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:#d7ff00;box-shadow:0 0 60px rgba(215,255,0,.6)"></div>
</div>
  <div id="flash"></div><div id="grain"></div>
</div>
<script src="kinetic.js"></script>
<script>
const $ = id => document.getElementById(id);
const { clamp, lin, ease, eout, ein, spr, imp, hash, letters } = K;
const B = .5, DUR = 20;
window.DUR = DUR; window.SB = { bpm: 120 };
const BEATS = [...Array(40)].map((_, k) => k * B);
const HB = [0, .17, 1, 1.17, 2, 2.17, 3, 3.17];
const vis = (id, a, b, t) => { $(id).style.display = t >= a && t < b ? 'block' : 'none'; return t >= a && t < b; };

// stylised global temperature anomaly 1850→2024 (shape after the observed record; ends at the WMO 2024 value)
const PTS = [];
for (let y = 1850; y <= 2024; y++) {
  let v = y < 1910 ? -0.05 - .06 * Math.sin((y - 1850) / 9) : y < 1945 ? -0.05 + .3 * (y - 1910) / 35 : y < 1975 ? .25 - .05 * Math.sin((y - 1945) / 5) : .25 + .95 * ((y - 1975) / 49) ** 1.25;
  v += .045 * Math.sin(y * .83) + .03 * Math.sin(y * 2.1 + 1);
  if (y === 2024) v = 1.55;
  PTS.push([160 + (y - 1850) / 174 * 1600, 820 - v * 386, y, v]);
}
const path = 'M' + PTS.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
let LEN = 0, BANDS = [], CARDS = [], TAGS = [], H1, H2, H3, RINGS = [];

window.seek = async function (t) {
  let zoom = 1, sh = 0;
  const dot = $('dot');
  // ---------- 0–4 dot + orbit ----------
  if (vis('L1', 0, 4.02, t)) {
    const pop = spr(t, .25, 3, .35);
    $('t1').style.opacity = lin(t, .5, .8); $('t1').style.letterSpacing = (60 + 60 * (1 - eout(lin(t, .5, 1.6)))) + 'px';
    $('t2').style.opacity = lin(t, 1, 1.3); $('t2').style.letterSpacing = (44 + 50 * (1 - eout(lin(t, 1, 2.2)))) + 'px';
    const o = eout(lin(t, 2, 2.9)); $('orb').style.strokeDashoffset = 1 - o;
    [['spk1', 0, 1], ['spk2', Math.PI, .7]].forEach(([id, ph, s]) => {
      const a = ph + (t - 2) * 2.4, x = 330 * Math.cos(a), y = 96 * Math.sin(a), r = -14 * Math.PI / 180;
      $(id).setAttribute('transform', `translate(${960 + x * Math.cos(r) - y * Math.sin(r)} ${540 + x * Math.sin(r) + y * Math.cos(r)}) scale(${t > 2.2 ? s * (1 + .3 * Math.sin(t * 9)) : 0})`);
    });
    // at 3.5 the camera starts diving into the dot
    zoom = 1 + 2 * ein(lin(t, 3.4, 4));
    dot.style.visibility = 'visible';
    dot.style.transform = `scale(${pop * (1 + .35 * imp(t, HB, .14))})`;   // pulses with the heartbeat (lub-dub once a second)
  }
  // ---------- 4–8 the dot becomes the world: neon + temperature line ----------
  if (vis('L3', 4, 8, t)) {
    const r = 40 + 2300 * eout(lin(t, 4, 4.3));
    $('L3').style.clipPath = `circle(${r}px at 960px 540px)`;
    dot.style.visibility = 'hidden';
    const p = ease(lin(t, 4.3, 7.8)), i = Math.min(PTS.length - 1, Math.floor(p * (PTS.length - 1)));
    $('graph').style.strokeDashoffset = LEN * (1 - p);
    const [x, y, yr, v] = PTS[i];
    $('tip').setAttribute('cx', x); $('tip').setAttribute('cy', y);
    $('year').textContent = yr;
    $('tiplab').textContent = (v >= 0 ? '+' : '') + v.toFixed(2) + '°C';
    $('tiplab').style.transform = `translate(${Math.min(x + 30, 1560)}px,${y - 110}px)`;
    const cross = PTS.findIndex(q => q[3] >= 1.5), tc = 4.3 + (cross / (PTS.length - 1)) ** (1 / 3) * 0;   // crossing handled below
    zoom = 1 + .04 * imp(t, BEATS, .1) + .15 * ein(lin(t, 7.3, 8));
    sh = t > 7.75 ? 20 * lin(t, 7.75, 8) : 0;
  }
  // ---------- 8–11 glitch bands + thermometer ----------
  if (vis('L4', 8, 11, t)) {
    const k = Math.floor((t - 8) / (B / 2));
    BANDS.forEach((b, j) => {
      const dir = j % 2 ? 1 : -1, g = hash(k * 7 + j) > .7 ? (hash(k + j * 3) - .5) * 260 : 0;
      b.style.transform = `translateX(${dir * (t - 8) * 700 - 900 + g}px) scaleX(2.3)`;
      b.style.clipPath = hash(k * 13 + j) > .8 ? `inset(${20 + hash(k + j) * 40}% 0 ${10 + hash(k * 3 + j) * 30}% 0)` : 'none';
    });
    const h = 40 + 520 * ease(lin(t, 8, 10.8)); $('merc').setAttribute('y', 780 - h); $('merc').setAttribute('height', h + 60);
    zoom = 1 + .05 * imp(t, BEATS, .08); sh = 8 * imp(t, BEATS, .06);
  }
  // ---------- 11–14 alerts + hashtags ----------
  if (vis('L5', 11, 14, t)) {
    CARDS.forEach((c, j) => {
      const t0 = 11 + j * B, s = spr(t, t0, 2.8, .55), n = CARDS.filter((_, q) => 11 + q * B <= t).length;
      c.style.visibility = t >= t0 ? 'visible' : 'hidden';
      const slot = n - 1 - j;                                            // newest at the bottom, older pushed up
      c.style.transform = `translateY(${650 - slot * 170 + (1 - s) * 300}px) scale(${1 - slot * .04})`;
      c.style.opacity = 1 - slot * .15;
    });
    TAGS.forEach(({ e, t0, x, y, r }) => { const s = spr(t, t0, 3, .45); e.style.visibility = t >= t0 ? 'visible' : 'hidden';
      e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; });
    zoom = 1 + .04 * imp(t, BEATS, .1) + .1 * lin(t, 13, 14);
  }
  // ---------- 14–17 the spotlight story ----------
  if (vis('L6', 14, 17.75, t)) {
    const s = spr(t, 14, 2.2, .6), grow = spr(t, 16, 3, .4), shrink = ein(lin(t, 17, 17.75));
    $('spot').style.transform = `scale(${(s * .8 + .5 * grow) * (1 - shrink * .93)})`;
    $('spot').style.background = t >= 16 ? '#d7ff00' : '#fff';
    const wr = (el, t0, d) => { const p = lin(t, t0, t0 + d); el.style.clipPath = `inset(0 ${100 - p * 100}% 0 0)`; };
    [H1, H2].forEach(e => e.style.opacity = t < 16 ? 1 : 0);
    wr(H1, 14.25, .6); wr(H2, 15, .5);
    H3.style.opacity = t >= 16 && t < 17 ? 1 : 0; H3.style.transform = `scale(${1 + .6 * (1 - eout(lin(t, 16, 16.15)))}) rotate(-4deg)`;
    // everything sucks back into the dot
    zoom = 1 + .06 * ein(lin(t, 17, 17.75));
  }
  // ---------- 17.75–18 silence: pure black ----------
  // ---------- 18–20 burst ----------
  if (vis('L8', 18, 20.1, t)) {
    const u = t - 18;
    RINGS.forEach((r, j) => { const p = eout(clamp((u - j * .08) / .9)); r.setAttribute('r', 20 + p * (900 + j * 300)); r.setAttribute('stroke-width', 30 * (1 - p) + 1); r.style.opacity = 1 - p; });
    $('big').style.transform = `scale(${1 + 1.4 * (1 - eout(clamp(u / .14)))})`;
    $('big').style.textShadow = u < .3 ? `${-20 * (1 - u / .3)}px 0 rgba(215,255,0,.9), ${20 * (1 - u / .3)}px 0 rgba(255,255,255,.6)` : '0 0 80px rgba(215,255,0,.5)';
    $('ch').style.opacity = u > B ? 1 : 0; $('ch').style.letterSpacing = (34 + 60 * (1 - eout(lin(u, B, 1.2)))) + 'px';
    $('kw').style.opacity = u > 2 * B ? 1 : 0; $('kw').style.letterSpacing = (70 + 120 * (1 - eout(lin(u, 2 * B, 1.8)))) + 'px';
    zoom = 1 + .05 * imp(t, BEATS, .1); sh = 26 * imp(t, [18], .13);
  }
  if (t >= 4 && t < 17.75 && !(t >= 14)) dot.style.visibility = 'hidden';
  if (t >= 14) dot.style.visibility = 'hidden';
  $('flash').style.opacity = .9 * imp(t, [18], .07);
  $('cam').style.transform = `translate(${Math.sin(t * 97) * sh}px,${Math.cos(t * 83) * sh}px) scale(${zoom})`;
};

window.READY = (async () => {
  $('graph').setAttribute('d', path); LEN = $('graph').getTotalLength();
  $('graph').style.strokeDasharray = LEN; $('graph').style.strokeDashoffset = LEN;
  for (let j = 0; j < 6; j++) {
    const b = document.createElement('div'); b.className = 'band'; b.style.top = (20 + j * 175) + 'px';
    b.textContent = '뜨거워진다 · '.repeat(8);
    if (j % 2) { b.style.color = 'transparent'; b.style.webkitTextStroke = '3px #fff'; } else b.style.color = '#d7ff00';
    $('bands').appendChild(b); BANDS.push(b);
  }
  [['c1', '폭염 경보', '오늘 낮 최고기온 또 경신'], ['c2', '산불 확산', '강풍 타고 번지는 불길'], ['c3', '도심 침수', '기록적인 폭우'], ['c5', '빙하 붕괴', '해수면 상승 가속']].forEach(([c, a, b2]) => {
    const e = document.createElement('div'); e.className = 'card';
    e.innerHTML = `<img src="clips/${c}/f_0060.jpg"><div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:24px;font-weight:700;color:#777"><span>기후 알림</span><span>지금</span></div>
      <div style="font-size:46px;font-weight:900">${a}</div><div style="font-size:28px;font-weight:500;color:#444">${b2}</div></div>`;
    e.style.top = '0px'; $('cards').appendChild(e); CARDS.push(e);
  });
  ['#폭염', '#산불', '#홍수', '#빙하', '#가뭄', '#태풍'].forEach((s, j) => {
    const e = document.createElement('div'); e.className = 'tag'; e.textContent = s; $('tags').appendChild(e);
    TAGS.push({ e, t0: 13 + j * B / 3, x: [80, 1380, 160, 1300, 60, 1420][j], y: [80, 120, 820, 780, 440, 450][j], r: (hash(j) - .5) * 16 });
  });
  H1 = $('h1'); H2 = $('h2'); H3 = $('h3');
  H1.textContent = '괜찮을 거라고'; H2.textContent = '생각했어'; H3.textContent = '정말?';
  for (let j = 0; j < 3; j++) { const r = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); r.setAttribute('cx', 960); r.setAttribute('cy', 540); r.setAttribute('fill', 'none'); r.setAttribute('stroke', '#d7ff00'); $('rings').appendChild(r); RINGS.push(r); }
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  await window.seek(0);
})();
</script>
</body>
</html>
